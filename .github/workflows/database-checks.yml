# Builds the database from scratch on every push, runs the SQL rule checks
# and then the pytest suite. If a script breaks or a business rule stops
# working, the badge in the README turns red.

name: database-checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Create schema, rules and views
        run: |
          psql -v ON_ERROR_STOP=1 -q -f sql/01_schema.sql
          psql -v ON_ERROR_STOP=1 -q -f sql/02_business_rules.sql
          psql -v ON_ERROR_STOP=1 -q -f sql/03_views.sql

      - name: Load sample data (every movement passes through the triggers)
        run: psql -v ON_ERROR_STOP=1 -q -f sql/04_sample_data.sql

      - name: Run analysis queries
        run: psql -v ON_ERROR_STOP=1 -f sql/05_analysis_queries.sql

      - name: Run business rule checks
        run: psql -v ON_ERROR_STOP=1 -f sql/06_rule_checks.sql

      - name: Count closing, reporting mart and roles
        run: |
          psql -v ON_ERROR_STOP=1 -q -f sql/07_count_closing.sql
          psql -v ON_ERROR_STOP=1 -q -f sql/08_reporting_mart.sql
          psql -v ON_ERROR_STOP=1 -f sql/09_access_roles.sql

      - name: Run feature checks (count closing, mart, roles)
        run: psql -v ON_ERROR_STOP=1 -f sql/10_feature_checks.sql

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest ( builds its own throwaway database)
        run: pytest -v
